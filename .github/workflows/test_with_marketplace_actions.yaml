name: Manually Triggered Workflows

# Test in local via act
# act --input trigger=manually --secret-file my.secrets --var-file my.variables --pull=false --container-architecture linux/amd64 -W .github/workflows/test_with_marketplace_actions.yaml
on:
  workflow_dispatch:
    inputs:
      trigger:
        description: 'Pass Inputs to Manually Triggered Workflows'
        default: 'manually'

jobs:
  test_from_marketplace:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]

    steps:
    - name: Checkout repository
      uses: actions/checkout@v3

    - name: Upload artifacts to Mosapi CMS
      uses: Mostorm-Labs/mosapi-action@v1.0.0
      with:
        token: ${{ secrets.MOSAPI_TOKEN }}
        folder-id: ${{ vars.MOSAPI_FOLDER_ID }}
        product-id: ${{ vars.MOSAPI_PRODUCT_ID }}
        version: '1.0.2'
        product-slug: 'mosapi-action-test'
        wechat-webhook-key: ${{ secrets.WECOM_ROBOTS_KEY }}
        artifacts: |
          test-resource/dist/*.exe
          test-resource/dist/*.zip
          !test-resource/dist/*.map
