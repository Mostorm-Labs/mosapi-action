name: Test

on: [push, pull_request]

jobs:
  main:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]

    steps:
    - name: Checkout repository
      uses: actions/checkout@v3

    - name: Upload test artifacts to Mosapi
      uses: ./
      with:
        token: ${{ secrets.MOSAPI_TOKEN }}
        folder-id: ${{ vars.MOSAPI_FOLDER_ID }}
        product-id: ${{ vars.MOSAPI_PRODUCT_ID }}
        version: '1.0.2'
        product-slug: 'mosapi-action-test'
        wechat-webhook-key: ${{ secrets.WECOM_ROBOTS_KEY }}
        artifacts: |
          test-resource/dist/*.exe
          test-resource/dist/*.zip
          !test-resource/dist/*.map
